- aid: chatwoot:platform-api
  name: Chatwoot Platform API
  description: The Platform API is used to manage Chatwoot installations at the super admin level, including
    managing accounts, users, and installation-wide settings. Requires Platform App access tokens from
    the Super Admin Console. Available only on self-hosted and managed hosting deployments.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
