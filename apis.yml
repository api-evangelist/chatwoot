aid: chatwoot
name: Chatwoot
description: Chatwoot is an open-source customer support and omni-channel messaging platform that provides
  REST APIs for managing conversations, contacts, agents, teams, labels, and integrating customer communication
  workflows. It supports live chat, email, WhatsApp, Facebook, Instagram, Telegram, SMS, and more, with
  Application APIs for agent-level automation, Client APIs for custom chat interfaces, and Platform APIs
  for managing self-hosted installations at scale.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
